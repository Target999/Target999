<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow - Smart To-Do List</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f8fafc);
    color: #222;
    transition: 0.3s;
}

.app {
    max-width: 850px;
    margin: auto;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.12);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 50px;
    height: 50px;
    border-radius: 14px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    font-weight: bold;
}

.brand h1 {
    margin: 0;
    color: #4f46e5;
    font-size: 28px;
}

.brand p {
    margin: 3px 0 0;
    color: #777;
    font-size: 13px;
}

.header-buttons {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

button {
    border: none;
    border-radius: 8px;
    padding: 10px 13px;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    opacity: 0.85;
}

.dark-button {
    background: #222;
    color: white;
}

.account-button {
    background: #4f46e5;
    color: white;
}

.welcome {
    background: #eef2ff;
    border-radius: 12px;
    padding: 12px 15px;
    margin-bottom: 15px;
    color: #3730a3;
    display: none;
}

.section-title {
    text-align: left;
    margin: 15px 0 8px;
    font-size: 15px;
    font-weight: bold;
}

.input-area {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

input,
select {
    padding: 12px;
    border: 1px solid #bbb;
    border-radius: 8px;
    font-size: 15px;
    background: white;
    color: #222;
}

#taskInput {
    flex: 1;
    min-width: 200px;
}

#prioritySelect {
    min-width: 120px;
}

.date-time-area {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
}

.date-time-area input {
    flex: 1;
    min-width: 150px;
}

#addButton {
    background: #16a34a;
    color: white;
    min-width: 90px;
}

.tools {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
}

#searchInput {
    flex: 1;
    min-width: 180px;
}

#priorityFilter,
#sortSelect {
    min-width: 145px;
}

.clear-completed {
    background: #7c3aed;
    color: white;
}

.clear-all {
    background: #dc2626;
    color: white;
}

.counters {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin: 20px 0;
}

.counter {
    color: white;
    padding: 15px 10px;
    border-radius: 12px;
    font-weight: bold;
    text-align: center;
}

.counter-number {
    display: block;
    font-size: 25px;
    margin-top: 5px;
}

.total {
    background: #2563eb;
}

.completed {
    background: #16a34a;
}

.remaining {
    background: #ea580c;
}

.overdue {
    background: #dc2626;
}

.progress-area {
    margin: 15px 0 20px;
    text-align: left;
}

.progress-title {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 6px;
}

.progress-bar {
    height: 10px;
    background: #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #4f46e5, #7c3aed);
    transition: 0.3s;
}

#taskList {
    list-style: none;
    padding: 0;
    margin: 0;
}

.task-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 15px;
    margin: 10px 0;
    background: #f8fafc;
    border-left: 6px solid #4f46e5;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    text-align: left;
}

.task-main {
    flex: 1;
    min-width: 180px;
}

.task-text {
    display: block;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    overflow-wrap: anywhere;
    margin-bottom: 7px;
}

.task-text.completed-task {
    text-decoration: line-through;
    color: #888;
}

.task-info {
    font-size: 12px;
    color: #666;
}

.priority-label {
    display: inline-block;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
    margin-right: 5px;
}

.high {
    background: #fee2e2;
    color: #b91c1c;
}

.medium {
    background: #fef3c7;
    color: #92400e;
}

.low {
    background: #dcfce7;
    color: #166534;
}

.deadline-normal {
    color: #555;
}

.deadline-overdue {
    color: red;
    font-weight: bold;
}

.deadline-completed {
    color: green;
    font-weight: bold;
}

.task-actions {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
}

.edit-button {
    background: #f59e0b;
    color: white;
}

.delete-button {
    background: #dc2626;
    color: white;
}

.empty-message {
    color: #888;
    padding: 25px;
    text-align: center;
}

.stats-box {
    background: #f8fafc;
    padding: 15px;
    border-radius: 12px;
    margin-top: 15px;
    text-align: left;
}

.stats-box h3 {
    margin-top: 0;
}

.stats-row {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px solid #ddd;
    font-size: 14px;
}

.stats-row:last-child {
    border-bottom: none;
}

.reminder-box {
    display: none;
    background: #fff7ed;
    color: #9a3412;
    border: 1px solid #fed7aa;
    border-radius: 10px;
    padding: 12px;
    margin-top: 15px;
    text-align: left;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.modal-box {
    background: white;
    width: 100%;
    max-width: 400px;
    border-radius: 16px;
    padding: 25px;
}

.modal-box h2 {
    margin-top: 0;
    color: #4f46e5;
}

.modal-box input {
    width: 100%;
    margin-bottom: 10px;
}

.modal-buttons {
    display: flex;
    gap: 8px;
}

.modal-buttons button {
    flex: 1;
}

.login-button {
    background: #4f46e5;
    color: white;
}

.signup-button {
    background: #16a34a;
    color: white;
}

.close-button {
    background: #ddd;
}

.footer {
    text-align: center;
    color: #888;
    font-size: 12px;
    margin-top: 20px;
}

body.dark {
    background: #111827;
    color: white;
}

body.dark .card {
    background: #1f2937;
}

body.dark .brand p {
    color: #aaa;
}

body.dark .welcome {
    background: #312e81;
    color: white;
}

body.dark input,
body.dark select {
    background: #374151;
    color: white;
    border-color: #6b7280;
}

body.dark .task-item {
    background: #374151;
}

body.dark .task-info {
    color: #ddd;
}

body.dark .deadline-normal {
    color: #ddd;
}

body.dark .stats-box {
    background: #374151;
}

body.dark .stats-row {
    border-color: #555;
}

body.dark .modal-box {
    background: #1f2937;
    color: white;
}

body.dark .modal-box input {
    background: #374151;
    color: white;
}

body.dark .close-button {
    background: #555;
    color: white;
}

@media (max-width: 650px) {

    body {
        padding: 10px;
    }

    .card {
        padding: 15px;
    }

    .counters {
        grid-template-columns: repeat(2, 1fr);
    }

    .input-area,
    .date-time-area {
        flex-direction: column;
    }

    #taskInput,
    #prioritySelect,
    .date-time-area input,
    #addButton {
        width: 100%;
    }

    .tools {
        flex-direction: column;
    }

    #searchInput,
    #priorityFilter,
    #sortSelect,
    .tools button {
        width: 100%;
    }

    .task-item {
        flex-direction: column;
        align-items: stretch;
    }

    .task-actions {
        justify-content: flex-end;
    }
}
</style>
</head>

<body>

<div class="app">

<div class="card">

<div class="header">

<div class="logo-area">

<div class="logo">✓</div>

<div class="brand">
<h1>TaskFlow</h1>
<p>Smart To-Do List</p>
</div>

</div>

<div class="header-buttons">

<button class="dark-button" id="darkModeButton">
🌙 Dark Mode
</button>

<button class="account-button" id="accountButton">
👤 Login
</button>

</div>

</div>


<div class="welcome" id="welcomeBox">
Welcome! <strong id="userName"></strong>
</div>


<div class="section-title">
Add New Task
</div>


<div class="input-area">

<input
type="text"
id="taskInput"
placeholder="Write a task..."
>

<select id="prioritySelect">

<option value="High">
High
</option>

<option value="Medium" selected>
Medium
</option>

<option value="Low">
Low
</option>

</select>

</div>


<div class="date-time-area">

<input type="date" id="dateInput">

<input type="time" id="timeInput">

<button id="addButton">
➕ Add
</button>

</div>


<div class="tools">

<input
type="text"
id="searchInput"
placeholder="🔍 Search tasks..."
>

<select id="priorityFilter">

<option value="All">
All Priorities
</option>

<option value="High">
High
</option>

<option value="Medium">
Medium
</option>

<option value="Low">
Low
</option>

</select>

<select id="sortSelect">

<option value="newest">
Newest First
</option>

<option value="oldest">
Oldest First
</option>

<option value="priority">
Priority
</option>

<option value="deadline">
Deadline
</option>

</select>

</div>


<div class="tools">

<button class="clear-completed" id="clearCompletedButton">
✓ Clear Completed
</button>

<button class="clear-all" id="clearButton">
🗑 Clear All
</button>

</div>


<div class="counters">

<div class="counter total">
Total
<span class="counter-number" id="totalCount">0</span>
</div>

<div class="counter completed">
Completed
<span class="counter-number" id="completedCount">0</span>
</div>

<div class="counter remaining">
Remaining
<span class="counter-number" id="remainingCount">0</span>
</div>

<div class="counter overdue">
Overdue
<span class="counter-number" id="overdueCount">0</span>
</div>

</div>


<div class="progress-area">

<div class="progress-title">

<span>
Completion Progress
</span>

<strong id="progressText">
0%
</strong>

</div>

<div class="progress-bar">

<div
class="progress-fill"
id="progressFill">
</div>

</div>

</div>


<div
class="reminder-box"
id="reminderBox">
</div>


<ul id="taskList"></ul>


<div class="stats-box">

<h3>
📊 Task Statistics
</h3>

<div class="stats-row">
<span>High Priority</span>
<strong id="highCount">0</strong>
</div>

<div class="stats-row">
<span>Medium Priority</span>
<strong id="mediumCount">0</strong>
</div>

<div class="stats-row">
<span>Low Priority</span>
<strong id="lowCount">0</strong>
</div>

<div class="stats-row">
<span>Tasks With Deadline</span>
<strong id="deadlineCount">0</strong>
</div>

</div>


<div class="footer">
TaskFlow • Your simple smart task manager
</div>

</div>

</div>


<div class="modal" id="accountModal">

<div class="modal-box">

<h2>
Login / Sign Up
</h2>

<input
type="text"
id="usernameInput"
placeholder="Username"
>

<input
type="password"
id="passwordInput"
placeholder="Password"
>

<div class="modal-buttons">

<button
class="login-button"
id="loginButton">
Login
</button>

<button
class="signup-button"
id="signupButton">
Sign Up
</button>

<button
class="close-button"
id="closeModalButton">
Close
</button>

</div>

</div>

</div>


<script>

const taskInput =
document.getElementById("taskInput");

const prioritySelect =
document.getElementById("prioritySelect");

const dateInput =
document.getElementById("dateInput");

const timeInput =
document.getElementById("timeInput");

const addButton =
document.getElementById("addButton");

const taskList =
document.getElementById("taskList");

const searchInput =
document.getElementById("searchInput");

const priorityFilter =
document.getElementById("priorityFilter");

const sortSelect =
document.getElementById("sortSelect");

const clearButton =
document.getElementById("clearButton");

const clearCompletedButton =
document.getElementById("clearCompletedButton");

const darkModeButton =
document.getElementById("darkModeButton");

const totalCount =
document.getElementById("totalCount");

const completedCount =
document.getElementById("completedCount");

const remainingCount =
document.getElementById("remainingCount");

const overdueCount =
document.getElementById("overdueCount");

const highCount =
document.getElementById("highCount");

const mediumCount =
document.getElementById("mediumCount");

const lowCount =
document.getElementById("lowCount");

const deadlineCount =
document.getElementById("deadlineCount");

const progressFill =
document.getElementById("progressFill");

const progressText =
document.getElementById("progressText");

const reminderBox =
document.getElementById("reminderBox");

const accountButton =
document.getElementById("accountButton");

const accountModal =
document.getElementById("accountModal");

const closeModalButton =
document.getElementById("closeModalButton");

const loginButton =
document.getElementById("loginButton");

const signupButton =
document.getElementById("signupButton");

const usernameInput =
document.getElementById("usernameInput");

const passwordInput =
document.getElementById("passwordInput");

const welcomeBox =
document.getElementById("welcomeBox");

const userName =
document.getElementById("userName");


let tasks =
JSON.parse(
localStorage.getItem("myTasks")
) || [];


function saveTasks() {

localStorage.setItem(
"myTasks",
JSON.stringify(tasks)
);

}


function isOverdue(task) {

if (task.completed) {
return false;
}

if (!task.date) {
return false;
}

let deadline =
new Date(
task.date +
"T" +
(task.time || "23:59")
);

return deadline < new Date();

}


function getPriorityNumber(priority) {

if (priority === "High") {
return 3;
}

if (priority === "Medium") {
return 2;
}

return 1;

}


function updateCounters() {

let total =
tasks.length;

let completed =
tasks.filter(
task => task.completed
).length;

let remaining =
total - completed;

let overdue =
tasks.filter(
task => isOverdue(task)
).length;


totalCount.textContent =
total;

completedCount.textContent =
completed;

remainingCount.textContent =
remaining;

overdueCount.textContent =
overdue;


highCount.textContent =
tasks.filter(
task => task.priority === "High"
).length;

mediumCount.textContent =
tasks.filter(
task => task.priority === "Medium"
).length;

lowCount.textContent =
tasks.filter(
task => task.priority === "Low"
).length;

deadlineCount.textContent =
tasks.filter(
task => task.date
).length;


let progress =
total === 0
? 0
: Math.round(
(completed / total) * 100
);

progressFill.style.width =
progress + "%";

progressText.textContent =
progress + "%";


updateReminder();

}


function updateReminder() {

let upcomingTasks =
tasks.filter(function(task) {

if (
task.completed ||
!task.date
) {
return false;
}

let deadline =
new Date(
task.date +
"T" +
(task.time || "23:59")
);

let now =
new Date();

let difference =
deadline - now;

let oneDay =
24 * 60 * 60 * 1000;

return (
difference > 0 &&
difference <= oneDay
);

});


if (upcomingTasks.length === 0) {

reminderBox.style.display =
"none";

reminderBox.textContent =
"";

return;

}


reminderBox.style.display =
"block";

reminderBox.textContent =
"🔔 Reminder: " +
upcomingTasks.length +
" task(s) have a deadline within the next 24 hours.";

}


function showTasks() {

taskList.innerHTML = "";


let searchText =
searchInput.value
.toLowerCase()
.trim();


let selectedPriority =
priorityFilter.value;


let filteredTasks =
tasks.filter(function(task) {

let taskText =
String(task.text || "")
.toLowerCase();


let matchesSearch =
taskText.includes(searchText);


let matchesPriority =
selectedPriority === "All" ||
task.priority === selectedPriority;


return (
matchesSearch &&
matchesPriority
);

});


let sortType =
sortSelect.value;


if (sortType === "newest") {

filteredTasks.sort(
(a,b) => b.id - a.id
);

}


if (sortType === "oldest") {

filteredTasks.sort(
(a,b) => a.id - b.id
);

}


if (sortType === "priority") {

filteredTasks.sort(
(a,b) =>
getPriorityNumber(b.priority) -
getPriorityNumber(a.priority)
);

}


if (sortType === "deadline") {

filteredTasks.sort(function(a,b) {

let dateA =
a.date
? new Date(
a.date +
"T" +
(a.time || "23:59")
)
: new Date("2999-12-31");

let dateB =
b.date
? new Date(
b.date +
"T" +
(b.time || "23:59")
)
: new Date("2999-12-31");

return dateA - dateB;

});

}


if (filteredTasks.length === 0) {

let emptyMessage =
document.createElement("li");

emptyMessage.className =
"empty-message";

emptyMessage.textContent =
"No tasks found.";

taskList.appendChild(
emptyMessage
);

updateCounters();

return;

}


filteredTasks.forEach(function(task) {

let li =
document.createElement("li");

li.className =
"task-item";


let main =
document.createElement("div");

main.className =
"task-main";


let text =
document.createElement("span");

text.className =
"task-text";


if (task.completed) {

text.classList.add(
"completed-task"
);

}


text.textContent =
task.text;


text.onclick =
function() {

task.completed =
!task.completed;

saveTasks();

showTasks();

};


let info =
document.createElement("div");

info.className =
"task-info";


let priorityLabel =
document.createElement("span");

priorityLabel.className =
"priority-label " +
(task.priority || "Medium")
.toLowerCase();

priorityLabel.textContent =
task.priority || "Medium";


info.appendChild(
priorityLabel
);


if (task.date) {

let deadline =
document.createElement("span");

deadline.textContent =
"Deadline: " +
task.date +
(
task.time
? " " + task.time
: ""
);


if (task.completed) {

deadline.className =
"deadline-completed";

}
else if (isOverdue(task)) {

deadline.className =
"deadline-overdue";

deadline.textContent +=
" (OVERDUE)";

}
else {

deadline.className =
"deadline-normal";

}


info.appendChild(
document.createTextNode(" ")
);

info.appendChild(
deadline
);

}


main.appendChild(text);

main.appendChild(info);


let actions =
document.createElement("div");

actions.className =
"task-actions";


let editButton =
document.createElement("button");

editButton.className =
"edit-button";

editButton.textContent =
"✏️ Edit";


editButton.onclick =
function() {

let newText =
prompt(
"Edit task:",
task.text
);


if (
newText !== null &&
newText.trim() !== ""
) {

task.text =
newText.trim();

saveTasks();

showTasks();

}

};


let deleteButton =
document.createElement("button");

deleteButton.className =
"delete-button";

deleteButton.textContent =
"🗑 Delete";


deleteButton.onclick =
function() {

if (
confirm(
"Delete this task?"
)
) {

tasks =
tasks.filter(
item =>
item.id !== task.id
);

saveTasks();

showTasks();

}

};


actions.appendChild(
editButton
);

actions.appendChild(
deleteButton
);


li.appendChild(main);

li.appendChild(actions);

taskList.appendChild(li);

});


updateCounters();

}


function addTask() {

let text =
taskInput.value.trim();


if (text === "") {

alert(
"Please write a task first."
);

taskInput.focus();

return;

}


let newTask = {

id: Date.now(),

text: text,

priority:
prioritySelect.value,

date:
dateInput.value,

time:
timeInput.value,

completed: false

};


tasks.push(newTask);

saveTasks();


taskInput.value = "";

dateInput.value = "";

timeInput.value = "";


/* IMPORTANT:
   Show all priorities after adding */
priorityFilter.value = "All";

searchInput.value = "";


showTasks();

taskInput.focus();

}


addButton.addEventListener(
"click",
addTask
);


taskInput.addEventListener(
"keydown",
function(event) {

if (
event.key === "Enter"
) {

addTask();

}

}
);


searchInput.addEventListener(
"input",
showTasks
);


priorityFilter.addEventListener(
"change",
showTasks
);


sortSelect.addEventListener(
"change",
showTasks
);


clearButton.addEventListener(
"click",
function() {

if (tasks.length === 0) {

alert(
"There are no tasks to clear."
);

return;

}


if (
confirm(
"Are you sure you want to delete ALL tasks?"
)
) {

tasks = [];

saveTasks();

showTasks();

}

}
);


clearCompletedButton.addEventListener(
"click",
function() {

let completedTasks =
tasks.filter(
task => task.completed
);


if (
completedTasks.length === 0
) {

alert(
"There are no completed tasks."
);

return;

}


if (
confirm(
"Delete all completed tasks?"
)
) {

tasks =
tasks.filter(
task => !task.completed
);

saveTasks();

showTasks();

}

}
);


function updateDarkModeButton() {

if (
document.body.classList.contains(
"dark"
)
) {

darkModeButton.textContent =
"☀️ Light Mode";

}
else {

darkModeButton.textContent =
"🌙 Dark Mode";

}

}


darkModeButton.addEventListener(
"click",
function() {

document.body.classList.toggle(
"dark"
);


let darkMode =
document.body.classList.contains(
"dark"
);


localStorage.setItem(
"darkMode",
darkMode
);


updateDarkModeButton();

}
);


let savedDarkMode =
localStorage.getItem(
"darkMode"
);


if (
savedDarkMode === "true"
) {

document.body.classList.add(
"dark"
);

}


updateDarkModeButton();


/* LOGIN / SIGNUP */

function getUsers() {

return JSON.parse(
localStorage.getItem(
"taskFlowUsers"
)
) || {};

}


signupButton.addEventListener(
"click",
function() {

let username =
usernameInput.value.trim();

let password =
passwordInput.value;


if (
username === "" ||
password === ""
) {

alert(
"Please enter username and password."
);

return;

}


if (
password.length < 4
) {

alert(
"Password must be at least 4 characters."
);

return;

}


let users =
getUsers();


if (users[username]) {

alert(
"This username already exists."
);

return;

}


users[username] =
password;


localStorage.setItem(
"taskFlowUsers",
JSON.stringify(users)
);


localStorage.setItem(
"taskFlowCurrentUser",
username
);


alert(
"Account created successfully!"
);


accountModal.style.display =
"none";


usernameInput.value = "";

passwordInput.value = "";


updateAccountUI();

}
);


loginButton.addEventListener(
"click",
function() {

let username =
usernameInput.value.trim();

let password =
passwordInput.value;


let users =
getUsers();


if (
users[username] &&
users[username] === password
) {

localStorage.setItem(
"taskFlowCurrentUser",
username
);


alert(
"Login successful!"
);


accountModal.style.display =
"none";


usernameInput.value = "";

passwordInput.value = "";


updateAccountUI();

}
else {

alert(
"Username or password is incorrect."
);

}

}
);


function updateAccountUI() {

let currentUser =
localStorage.getItem(
"taskFlowCurrentUser"
);


if (currentUser) {

accountButton.textContent =
"🚪 Logout";

welcomeBox.style.display =
"block";

userName.textContent =
currentUser;

}
else {

accountButton.textContent =
"👤 Login";

welcomeBox.style.display =
"none";

}

}


accountButton.addEventListener(
"click",
function() {

let currentUser =
localStorage.getItem(
"taskFlowCurrentUser"
);


if (currentUser) {

if (
confirm(
"Do you want to logout?"
)
) {

localStorage.removeItem(
"taskFlowCurrentUser"
);

updateAccountUI();

}

return;

}


accountModal.style.display =
"flex";

}
);


closeModalButton.addEventListener(
"click",
function() {

accountModal.style.display =
"none";

}
);


accountModal.addEventListener(
"click",
function(event) {

if (
event.target === accountModal
) {

accountModal.style.display =
"none";

}

}
);


updateAccountUI();

showTasks();


setInterval(
updateReminder,
60000
);

</script>
