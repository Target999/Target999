<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Smart To-Do List</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
            transition: 0.3s;
        }

        .card {
            background: white;
            max-width: 750px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px gray;
            transition: 0.3s;
        }

        h1 {
            color: blue;
            margin-bottom: 10px;
        }

        h2 {
            color: #333;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 12px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        #darkModeButton {
            background: #333;
            color: white;
        }

        #accountButton {
            background: #3498db;
            color: white;
        }

        .welcome {
            margin: 15px 0;
            padding: 12px;
            background: #eaf4ff;
            border-radius: 8px;
            color: #333;
        }

        .input-area {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        #taskInput {
            flex: 1;
            min-width: 180px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        input,
        select {
            padding: 10px;
            font-size: 14px;
            border: 1px solid #aaa;
            border-radius: 6px;
            background: white;
        }

        #prioritySelect {
            min-width: 120px;
        }

        .date-time-area {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .date-time-area input {
            flex: 1;
            min-width: 150px;
        }

        #addButton {
            background: green;
            color: white;
        }

        #addButton:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .tools {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        #searchInput {
            flex: 1;
            min-width: 150px;
        }

        #clearButton {
            background: crimson;
            color: white;
        }

        #clearCompletedButton {
            background: #8e44ad;
            color: white;
        }

        .counters {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .counter {
            flex: 1;
            min-width: 120px;
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
        }

        .total {
            background: #3498db;
        }

        .completed {
            background: #27ae60;
        }

        .remaining {
            background: #e67e22;
        }

        .overdue {
            background: #c0392b;
        }

        .progress-area {
            margin: 20px 0;
            text-align: left;
        }

        .progress-title {
            display: flex;
            justify-content: space-between;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .progress-container {
            width: 100%;
            height: 14px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background: #27ae60;
            transition: width 0.3s;
        }

        .reminder {
            padding: 10px;
            margin: 15px 0;
            border-radius: 8px;
            background: #fff3cd;
            color: #856404;
            display: none;
        }

        #taskList {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 14px;
            margin: 10px 0;
            background: #f8f8f8;
            border-left: 6px solid #3498db;
            border-radius: 7px;
            box-shadow: 0 2px 5px #ccc;
            text-align: left;
            flex-wrap: wrap;
        }

        .task-main {
            flex: 1;
            min-width: 180px;
        }

        .task-text {
            display: block;
            font-weight: bold;
            cursor: pointer;
            overflow-wrap: anywhere;
            margin-bottom: 6px;
        }

        .task-text.completed-task {
            text-decoration: line-through;
            color: gray;
        }

        .task-info {
            font-size: 12px;
            color: #666;
        }

        .priority-label {
            display: inline-block;
            padding: 4px 7px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            margin-right: 5px;
        }

        .high {
            background: #ffcccc;
            color: #b30000;
        }

        .medium {
            background: #fff0b3;
            color: #8a6500;
        }

        .low {
            background: #ccffcc;
            color: #176b17;
        }

        .deadline-normal {
            color: #555;
        }

        .deadline-overdue {
            color: red;
            font-weight: bold;
        }

        .deadline-completed {
            color: green;
            font-weight: bold;
        }

        .task-actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .edit-button {
            background: #f39c12;
            color: white;
        }

        .delete-button {
            background: red;
            color: white;
        }

        .empty-message {
            color: gray;
            padding: 20px;
        }

        .sort-area {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 7px;
            display: none;
        }

        .status.error {
            display: block;
            background: #ffdddd;
            color: #a00;
        }

        .status.success {
            display: block;
            background: #ddffdd;
            color: #176b17;
        }

        .stats {
            margin-top: 25px;
            text-align: left;
        }

        .stats h3 {
            text-align: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .stat-box {
            padding: 12px;
            background: #f1f1f1;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box strong {
            display: block;
            font-size: 20px;
            margin-top: 5px;
        }

        .footer {
            margin-top: 25px;
            color: #777;
            font-size: 13px;
        }

        /* Modal */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px black;
        }

        .modal-content h2 {
            margin-top: 0;
        }

        .modal-content input {
            width: 100%;
            margin-bottom: 10px;
        }

        .auth-buttons {
            display: flex;
            gap: 8px;
            margin-top: 5px;
        }

        .auth-buttons button {
            flex: 1;
        }

        #loginButton {
            background: #3498db;
            color: white;
        }

        #signupButton {
            background: #27ae60;
            color: white;
        }

        #logoutButton {
            background: crimson;
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        #forgotButton {
            background: #8e44ad;
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        #closeModalButton {
            background: #777;
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        body.dark {
            background: #181818;
            color: white;
        }

        body.dark .card {
            background: #262626;
            box-shadow: 0 4px 15px black;
        }

        body.dark h2 {
            color: white;
        }

        body.dark .welcome {
            background: #333;
            color: white;
        }

        body.dark .task-item {
            background: #333;
            box-shadow: 0 2px 5px black;
        }

        body.dark .task-info {
            color: #ccc;
        }

        body.dark .deadline-normal {
            color: #ddd;
        }

        body.dark input,
        body.dark select {
            background: #333;
            color: white;
            border-color: #777;
        }

        body.dark .stat-box {
            background: #333;
        }

        body.dark .modal-content {
            background: #262626;
            color: white;
        }

        @media (max-width: 550px) {

            body {
                padding: 10px;
            }

            .card {
                padding: 15px;
            }

            .input-area,
            .date-time-area {
                flex-direction: column;
            }

            #addButton {
                width: 100%;
            }

            .task-item {
                flex-direction: column;
                align-items: stretch;
            }

            .task-actions {
                justify-content: flex-end;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

    </style>

</head>


<body>

    <div class="card">

        <div class="top-bar">

            <button id="darkModeButton">
                🌙 Dark Mode
            </button>

            <button id="accountButton">
                👤 Login
            </button>

        </div>


        <h1>TaskFlow</h1>

        <h2>Smart To-Do List</h2>


        <div class="welcome">

            Welcome!
            <strong id="userNameDisplay">Please Login</strong>

        </div>


        <div id="statusBox" class="status"></div>


        <div class="input-area">

            <input
                type="text"
                id="taskInput"
                placeholder="Write a task..."
            >

            <select id="prioritySelect">

                <option value="High">High</option>

                <option value="Medium" selected>
                    Medium
                </option>

                <option value="Low">Low</option>

            </select>

        </div>


        <div class="date-time-area">

            <input
                type="date"
                id="dateInput"
            >

            <input
                type="time"
                id="timeInput"
            >

            <button id="addButton">
                ➕ Add
            </button>

        </div>


        <div class="tools">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search tasks..."
            >

            <select id="priorityFilter">

                <option value="All">
                    All Priorities
                </option>

                <option value="High">
                    High
                </option>

                <option value="Medium">
                    Medium
                </option>

                <option value="Low">
                    Low
                </option>

            </select>

        </div>


        <div class="sort-area">

            <select id="sortSelect">

                <option value="newest">
                    Newest First
                </option>

                <option value="oldest">
                    Oldest First
                </option>

                <option value="priority">
                    Priority
                </option>

                <option value="deadline">
                    Deadline
                </option>

            </select>

        </div>


        <div class="tools">

            <button id="clearCompletedButton">
                ✓ Clear Completed
            </button>

            <button id="clearButton">
                🗑 Clear All
            </button>

        </div>


        <div class="counters">

            <div class="counter total">
                Total:
                <span id="totalCount">0</span>
            </div>

            <div class="counter completed">
                Completed:
                <span id="completedCount">0</span>
            </div>

            <div class="counter remaining">
                Remaining:
                <span id="remainingCount">0</span>
            </div>

            <div class="counter overdue">
                Overdue:
                <span id="overdueCount">0</span>
            </div>

        </div>


        <div class="progress-area">

            <div class="progress-title">

                <span>Completion Progress</span>

                <strong id="progressText">0%</strong>

            </div>

            <div class="progress-container">

                <div id="progressBar"></div>

            </div>

        </div>


        <div id="reminderBox" class="reminder"></div>


        <ul id="taskList"></ul>


        <div class="stats">

            <h3>📊 Task Statistics</h3>

            <div class="stats-grid">

                <div class="stat-box">
                    High Priority
                    <strong id="highCount">0</strong>
                </div>

                <div class="stat-box">
                    Medium Priority
                    <strong id="mediumCount">0</strong>
                </div>

                <div class="stat-box">
                    Low Priority
                    <strong id="lowCount">0</strong>
                </div>

                <div class="stat-box">
                    Tasks With Deadline
                    <strong id="deadlineCount">0</strong>
                </div>

            </div>

        </div>


        <div class="footer">
            TaskFlow • Your simple smart task manager
        </div>

    </div>


    <!-- Login / Signup Modal -->

    <div id="authModal" class="modal">

        <div class="modal-content">

            <h2>Login / Sign Up</h2>

            <input
                type="email"
                id="emailInput"
                placeholder="Email"
            >

            <input
                type="password"
                id="passwordInput"
                placeholder="Password"
            >

            <div class="auth-buttons">

                <button id="loginButton">
                    Login
                </button>

                <button id="signupButton">
                    Sign Up
                </button>

            </div>

            <button id="forgotButton">
                Forgot Password
            </button>

            <button id="logoutButton">
                Logout
            </button>

            <button id="closeModalButton">
                Close
            </button>

        </div>

    </div>


    <script>

        /* ================================
           SUPABASE CONFIG
        ================================= */

        const SUPABASE_URL =
            "https://apfopmmnfrgljezzpdji.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_kbM2VI5fg_-MffJ6mtvoUA_vVXPLSNf";

        const { createClient } = supabase;

        const db =
            createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* ================================
           ELEMENTS
        ================================= */

        const taskInput =
            document.getElementById("taskInput");

        const prioritySelect =
            document.getElementById("prioritySelect");

        const dateInput =
            document.getElementById("dateInput");

        const timeInput =
            document.getElementById("timeInput");

        const addButton =
            document.getElementById("addButton");

        const taskList =
            document.getElementById("taskList");

        const searchInput =
            document.getElementById("searchInput");

        const priorityFilter =
            document.getElementById("priorityFilter");

        const sortSelect =
            document.getElementById("sortSelect");

        const clearButton =
            document.getElementById("clearButton");

        const clearCompletedButton =
            document.getElementById("clearCompletedButton");

        const darkModeButton =
            document.getElementById("darkModeButton");

        const accountButton =
            document.getElementById("accountButton");

        const authModal =
            document.getElementById("authModal");

        const emailInput =
            document.getElementById("emailInput");

        const passwordInput =
            document.getElementById("passwordInput");

        const loginButton =
            document.getElementById("loginButton");

        const signupButton =
            document.getElementById("signupButton");

        const forgotButton =
            document.getElementById("forgotButton");

        const logoutButton =
            document.getElementById("logoutButton");

        const closeModalButton =
            document.getElementById("closeModalButton");

        const userNameDisplay =
            document.getElementById("userNameDisplay");

        const statusBox =
            document.getElementById("statusBox");

        const totalCount =
            document.getElementById("totalCount");

        const completedCount =
            document.getElementById("completedCount");

        const remainingCount =
            document.getElementById("remainingCount");

        const overdueCount =
            document.getElementById("overdueCount");

        const progressBar =
            document.getElementById("progressBar");

        const progressText =
            document.getElementById("progressText");

        const reminderBox =
            document.getElementById("reminderBox");

        const highCount =
            document.getElementById("highCount");

        const mediumCount =
            document.getElementById("mediumCount");

        const lowCount =
            document.getElementById("lowCount");

        const deadlineCount =
            document.getElementById("deadlineCount");


        let tasks = [];

        let currentUser = null;


        /* ================================
           STATUS MESSAGE
        ================================= */

        function showStatus(message, type = "success") {

            statusBox.textContent =
                message;

            statusBox.className =
                "status " + type;

            setTimeout(function() {

                statusBox.className =
                    "status";

            }, 5000);

        }


        /* ================================
           AUTH
        ================================= */

        async function loadUser() {

            const {
                data,
                error
            } =
                await db.auth.getSession();

            if (error) {

                showStatus(
                    error.message,
                    "error"
                );

                return;

            }

            currentUser =
                data.session
                    ? data.session.user
                    : null;

            updateAccountUI();

            if (currentUser) {

                await loadTasks();

            }
            else {

                tasks = [];

                showTasks();

            }

        }


        function updateAccountUI() {

            if (currentUser) {

                const email =
                    currentUser.email || "User";

                userNameDisplay.textContent =
                    email;

                accountButton.textContent =
                    "👤 Account";

                addButton.disabled =
                    false;

                logoutButton.style.display =
                    "block";

            }
            else {

                userNameDisplay.textContent =
                    "Please Login";

                accountButton.textContent =
                    "👤 Login";

                addButton.disabled =
                    true;

                logoutButton.style.display =
                    "none";

            }

        }


        accountButton.addEventListener(
            "click",
            function() {

                authModal.style.display =
                    "flex";

            }
        );


        closeModalButton.addEventListener(
            "click",
            function() {

                authModal.style.display =
                    "none";

            }
        );


        authModal.addEventListener(
            "click",
            function(event) {

                if (
                    event.target === authModal
                ) {

                    authModal.style.display =
                        "none";

                }

            }
        );


        signupButton.addEventListener(
            "click",
            async function() {

                const email =
                    emailInput.value.trim();

                const password =
                    passwordInput.value;


                if (!email || !password) {

                    showStatus(
                        "Please enter email and password.",
                        "error"
                    );

                    return;

                }


                if (password.length < 6) {

                    showStatus(
                        "Password must be at least 6 characters.",
                        "error"
                    );

                    return;

                }


                signupButton.disabled =
                    true;


                const {
                    data,
                    error
                } =
                    await db.auth.signUp({

                        email: email,

                        password: password

                    });


                signupButton.disabled =
                    false;


                if (error) {

                    showStatus(
                        error.message,
                        "error"
                    );

                    return;

                }


                if (
                    data.user &&
                    !data.session
                ) {

                    showStatus(
                        "Account created. Please check your email to confirm your account.",
                        "success"
                    );

                }
                else {

                    showStatus(
                        "Account created successfully.",
                        "success"
                    );

                    authModal.style.display =
                        "none";

                }

            }
        );


        loginButton.addEventListener(
            "click",
            async function() {

                const email =
                    emailInput.value.trim();

                const password =
                    passwordInput.value;


                if (!email || !password) {

                    showStatus(
                        "Please enter email and password.",
                        "error"
                    );

                    return;

                }


                loginButton.disabled =
                    true;


                const {
                    data,
                    error
                } =
                    await db.auth.signInWithPassword({

                        email: email,

                        password: password

                    });


                loginButton.disabled =
                    false;


                if (error) {

                    showStatus(
                        error.message,
                        "error"
                    );

                    return;

                }


                currentUser =
                    data.user;


                updateAccountUI();

                authModal.style.display =
                    "none";

                emailInput.value = "";

                passwordInput.value = "";


                await loadTasks();


                showStatus(
                    "Login successful.",
                    "success"
                );

            }
        );


        forgotButton.addEventListener(
            "click",
            async function() {

                const email =
                    emailInput.value.trim();


                if (!email) {

                    showStatus(
                        "Enter your email first.",
                        "error"
                    );

                    return;

                }


                const {
                    error
                } =
                    await db.auth.resetPasswordForEmail(
                        email,
                        {
                            redirectTo:
                                window.location.origin
                        }
                    );


                if (error) {

                    showStatus(
                        error.message,
                        "error"
                    );

                    return;

                }


                showStatus(
                    "Password reset email sent.",
                    "success"
                );

            }
        );


        logoutButton.addEventListener(
            "click",
            async function() {

                const {
                    error
                } =
                    await db.auth.signOut();


                if (error) {

                    showStatus(
                        error.message,
                        "error"
                    );

                    return;

                }


                currentUser = null;

                tasks = [];

                updateAccountUI();

                showTasks();

                authModal.style.display =
                    "none";

                showStatus(
                    "Logged out successfully.",
                    "success"
                );

            }
        );


        db.auth.onAuthStateChange(
            async function(event, session) {

                currentUser =
                    session
                        ? session.user
                        : null;

                updateAccountUI();

                if (currentUser) {

                    await loadTasks();

                }
                else {

                    tasks = [];

                    showTasks();

                }

            }
        );


        /* ================================
           TASKS - SUPABASE
        ================================= */

        async function loadTasks() {

            if (!currentUser) {

                tasks = [];

                showTasks();

                return;

            }


            const {
                data,
                error
            } =
                await db
                    .from("tasks")
                    .select("*")
                    .eq(
                        "user_id",
                        currentUser.id
                    )
                    .order(
                        "id",
                        {
                            ascending: false
                        }
                    );


            if (error) {

                showStatus(
                    "Could not load tasks: " +
                    error.message,
                    "error"
                );

                return;

            }


            tasks =
                data || [];


            showTasks();

        }


        function isOverdue(task) {

            if (task.completed) {
                return false;
            }

            if (!task.date) {
                return false;
            }


            const deadlineString =
                task.date +
                "T" +
                (task.time || "23:59");


            const deadline =
                new Date(deadlineString);


            return deadline < new Date();

        }


        function getPriorityNumber(priority) {

            if (priority === "High") {
                return 3;
            }

            if (priority === "Medium") {
                return 2;
            }

            return 1;

        }


        function updateCounters() {

            const total =
                tasks.length;

            const completed =
                tasks.filter(
                    task => task.completed
                ).length;

            const remaining =
                total - completed;

            const overdue =
                tasks.filter(
                    task => isOverdue(task)
                ).length;


            totalCount.textContent =
                total;

            completedCount.textContent =
                completed;

            remainingCount.textContent =
                remaining;

            overdueCount.textContent =
                overdue;


            const progress =
                total === 0
                    ? 0
                    : Math.round(
                        (completed / total) * 100
                    );


            progressBar.style.width =
                progress + "%";

            progressText.textContent =
                progress + "%";


            highCount.textContent =
                tasks.filter(
                    task => task.priority === "High"
                ).length;

            mediumCount.textContent =
                tasks.filter(
                    task => task.priority === "Medium"
                ).length;

            lowCount.textContent =
                tasks.filter(
                    task => task.priority === "Low"
                ).length;

            deadlineCount.textContent =
                tasks.filter(
                    task => task.date
                ).length;

        }


        function updateReminder() {

            const upcoming =
                tasks.filter(function(task) {

                    if (
                        task.completed ||
                        !task.date
                    ) {

                        return false;

                    }

                    const deadline =
                        new Date(
                            task.date +
                            "T" +
                            (task.time || "23:59")
                        );

                    const now =
                        new Date();

                    const difference =
                        deadline - now;

                    return (
                        difference > 0 &&
                        difference <=
                        24 * 60 * 60 * 1000
                    );

                });


            if (upcoming.length > 0) {

                reminderBox.style.display =
                    "block";

                reminderBox.textContent =
                    "⏰ You have " +
                    upcoming.length +
                    " task(s) due within 24 hours.";

            }
            else {

                reminderBox.style.display =
                    "none";

            }

        }


        function showTasks() {

            taskList.innerHTML =
                "";


            const searchText =
                searchInput.value
                    .toLowerCase()
                    .trim();


            const selectedPriority =
                priorityFilter.value;


            let filteredTasks =
                tasks.filter(function(task) {

                    const taskText =
                        String(
                            task.text || ""
                        );


                    const matchesSearch =
                        taskText
                            .toLowerCase()
                            .includes(searchText);


                    const matchesPriority =
                        selectedPriority === "All" ||
                        task.priority === selectedPriority;


                    return (
                        matchesSearch &&
                        matchesPriority
                    );

                });


            const sortType =
                sortSelect.value;


            if (sortType === "newest") {

                filteredTasks.sort(
                    (a, b) =>
                        Number(b.id) -
                        Number(a.id)
                );

            }


            if (sortType === "oldest") {

                filteredTasks.sort(
                    (a, b) =>
                        Number(a.id) -
                        Number(b.id)
                );

            }


            if (sortType === "priority") {

                filteredTasks.sort(
                    (a, b) =>
                        getPriorityNumber(b.priority) -
                        getPriorityNumber(a.priority)
                );

            }


            if (sortType === "deadline") {

                filteredTasks.sort(
                    function(a, b) {

                        const dateA =
                            a.date
                                ? new Date(
                                    a.date +
                                    "T" +
                                    (a.time || "23:59")
                                )
                                : new Date(
                                    "2999-12-31"
                                );


                        const dateB =
                            b.date
                                ? new Date(
                                    b.date +
                                    "T" +
                                    (b.time || "23:59")
                                )
                                : new Date(
                                    "2999-12-31"
                                );


                        return dateA - dateB;

                    }
                );

            }


            if (filteredTasks.length === 0) {

                const emptyMessage =
                    document.createElement("li");

                emptyMessage.className =
                    "empty-message";

                emptyMessage.textContent =
                    currentUser
                        ? "No tasks found."
                        : "Please login to use TaskFlow.";

                taskList.appendChild(
                    emptyMessage
                );

                updateCounters();

                updateReminder();

                return;

            }


            filteredTasks.forEach(
                function(task) {

                    const li =
                        document.createElement("li");

                    li.className =
                        "task-item";


                    const main =
                        document.createElement("div");

                    main.className =
                        "task-main";


                    const text =
                        document.createElement("span");

                    text.className =
                        "task-text";


                    if (task.completed) {

                        text.classList.add(
                            "completed-task"
                        );

                    }


                    text.textContent =
                        task.text;


                    text.onclick =
                        async function() {

                            await toggleTask(
                                task
                            );

                        };


                    const info =
                        document.createElement("div");

                    info.className =
                        "task-info";


                    const priorityLabel =
                        document.createElement("span");

                    priorityLabel.className =
                        "priority-label " +
                        String(
                            task.priority || "Medium"
                        ).toLowerCase();

                    priorityLabel.textContent =
                        task.priority || "Medium";


                    info.appendChild(
                        priorityLabel
                    );


                    if (task.date) {

                        const deadline =
                            document.createElement("span");


                        deadline.textContent =
                            "Deadline: " +
                            task.date +
                            (
                                task.time
                                    ? " " + task.time
                                    : ""
                            );


                        if (task.completed) {

                            deadline.className =
                                "deadline-completed";

                        }
                        else if (
                            isOverdue(task)
                        ) {

                            deadline.className =
                                "deadline-overdue";

                            deadline.textContent +=
                                " (OVERDUE)";

                        }
                        else {

                            deadline.className =
                                "deadline-normal";

                        }


                        info.appendChild(
                            document.createTextNode(" ")
                        );

                        info.appendChild(
                            deadline
                        );

                    }


                    main.appendChild(text);

                    main.appendChild(info);


                    const actions =
                        document.createElement("div");

                    actions.className =
                        "task-actions";


                    const editButton =
                        document.createElement("button");

                    editButton.className =
                        "edit-button";

                    editButton.textContent =
                        "Edit";


                    editButton.onclick =
                        async function() {

                            const newText =
                                prompt(
                                    "Edit task:",
                                    task.text
                                );


                            if (
                                newText !== null &&
                                newText.trim() !== ""
                            ) {

                                const {
                                    error
                                } =
                                    await db
                                        .from("tasks")
                                        .update({
                                            text:
                                                newText.trim()
                                        })
                                        .eq(
                                            "id",
                                            task.id
                                        )
                                        .eq(
                                            "user_id",
                                            currentUser.id
                                        );


                                if (error) {

                                    showStatus(
                                        error.message,
                                        "error"
                                    );

                                    return;

                                }


                                await loadTasks();

                            }

                        };


                    const deleteButton =
                        document.createElement("button");

                    deleteButton.className =
                        "delete-button";

                    deleteButton.textContent =
                        "Delete";


                    deleteButton.onclick =
                        async function() {

                            if (
                                !confirm(
                                    "Delete this task?"
                                )
                            ) {

                                return;

                            }


                            const {
                                error
                            } =
                                await db
                                    .from("tasks")
                                    .delete()
                                    .eq(
                                        "id",
                                        task.id
                                    )
                                    .eq(
                                        "user_id",
                                        currentUser.id
                                    );


                            if (error) {

                                showStatus(
                                    error.message,
                                    "error"
                                );

                                return;

                            }


                            await loadTasks();

                        };


                    actions.appendChild(
                        editButton
                    );

                    actions.appendChild(
                        deleteButton
                    );


                    li.appendChild(main);

                    li.appendChild(actions);


                    taskList.appendChild(li);

                }
            );


            updateCounters();

            updateReminder();

        }


        async function toggleTask(task) {

            if (!currentUser) {

                return;

            }


            const {
                error
            } =
                await db
                    .from("tasks")
                    .update({
                        completed:
                            !task.completed
                    })
                    .eq(
                        "id",
                        task.id
                    )
                    .eq(
                        "user_id",
                        currentUser.id
                    );


            if (error) {

                showStatus(
                    error.message,
                    "error"
                );

                return;

            }


            await loadTasks();

        }


        async function addTask() {

            if (!currentUser) {

                showStatus(
                    "Please login first.",
                    "error"
                );

                authModal.style.display =
                    "flex";

                return;

            }


            const text =
                taskInput.value.trim();


            if (text === "") {

                alert(
                    "Please write a task first."
                );

                taskInput.focus();

                return;

            }


            addButton.disabled =
                true;


            const {
                error
            } =
                await db
                    .from("tasks")
                    .insert({

                        text: text,

                        priority:
                            prioritySelect.value,

                        date:
                            dateInput.value || null,

                        time:
                            timeInput.value || null,

                        completed:
                            false,

                        user_id:
                            currentUser.id

                    });


            addButton.disabled =
                false;


            if (error) {

                showStatus(
                    "Could not add task: " +
                    error.message,
                    "error"
                );

                return;

            }


            taskInput.value =
                "";

            dateInput.value =
                "";

            timeInput.value =
                "";


            await loadTasks();

            taskInput.focus();

        }


        addButton.addEventListener(
            "click",
            addTask
        );


        taskInput.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    addTask();

                }

            }
        );


        searchInput.addEventListener(
            "input",
            showTasks
        );


        priorityFilter.addEventListener(
            "change",
            showTasks
        );


        sortSelect.addEventListener(
            "change",
            showTasks
        );


        /* ================================
           CLEAR ALL
        ================================= */

        clearButton.addEventListener(
            "click",
            async function() {

                if (!currentUser) {

                    showStatus(
                        "Please login first.",
                        "error"
                    );

                    return;

                }


                if (tasks.length === 0) {

                    alert(
                        "There are no tasks to clear."
                    );

                    return;

                }


                if (
                    !confirm(
                        "Are you sure you want to delete ALL tasks?"
                    )
                ) {

                    return;

                }


                const {
                    error
                } =
                    await db
                        .from("tasks")
                        .delete()
                        .eq(
                            "user_id",
                            currentUser.id
                        );


                if (error) {

                    showStatus(
                        error.message,
                        "error"
                    );

                    return;

                }


                await loadTasks();

            }
        );


        /* ================================
           CLEAR COMPLETED
        ================================= */

        clearCompletedButton.addEventListener(
            "click",
            async function() {

                if (!currentUser) {

                    showStatus(
                        "Please login first.",
                        "error"
                    );

                    return;

                }


                const completedTasks =
                    tasks.filter(
                        task => task.completed
                    );


                if (
                    completedTasks.length === 0
                ) {

                    alert(
                        "There are no completed tasks."
                    );

                    return;

                }


                if (
                    !confirm(
                        "Delete all completed tasks?"
                    )
                ) {

                    return;

                }


                const {
                    error
                } =
                    await db
                        .from("tasks")
                        .delete()
                        .eq(
                            "user_id",
                            currentUser.id
                        )
                        .eq(
                            "completed",
                            true
                        );


                if (error) {

                    showStatus(
                        error.message,
                        "error"
                    );

                    return;

                }


                await loadTasks();

            }
        );


        /* ================================
           DARK MODE
        ================================= */

        function updateDarkModeButton() {

            if (
                document.body.classList.contains(
                    "dark"
                )
            ) {

                darkModeButton.textContent =
                    "☀️ Light Mode";

            }
            else {

                darkModeButton.textContent =
                    "🌙 Dark Mode";

            }

        }


        darkModeButton.addEventListener(
            "click",
            function() {

                document.body.classList.toggle(
                    "dark"
                );


                const darkMode =
                    document.body.classList.contains(
                        "dark"
                    );


                localStorage.setItem(
                    "darkMode",
                    darkMode
                );


                updateDarkModeButton();

            }
        );


        const savedDarkMode =
            localStorage.getItem(
                "darkMode"
            );


        if (
            savedDarkMode === "true"
        ) {

            document.body.classList.add(
                "dark"
            );

        }


        updateDarkModeButton();


        /* ================================
           START
        ================================= */

        updateAccountUI();

        showTasks();

        loadUser();

        setInterval(
            updateReminder,
            60000
        );

    </script>

</body>
